openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cours Online API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User operations
  - name: admin
    description: Admin operations
  - name: videos
    description: Video operations
  - name: categories
    description: Category operations
  - name: playlists
    description: Playlist operations
  - name: subscriptions
    description: Subscription plan operations
  - name: stats
    description: Statistics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google:
    post:
      operationId: googleLogin
      tags: [auth]
      summary: Sign in or sign up with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginInput"
      responses:
        "200":
          description: Google login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Google credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin-login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me/phone:
    patch:
      operationId: updateMyPhone
      tags: [auth]
      summary: Set or update current user's WhatsApp phone number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhoneInput"
      responses:
        "200":
          description: Phone updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /videos:
    get:
      operationId: getVideos
      tags: [videos]
      summary: Get all visible videos for current user
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Videos list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get single video
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: Get all categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /playlists:
    get:
      operationId: getPlaylists
      tags: [playlists]
      summary: Get all visible playlists with their videos
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Playlists list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get a single playlist with its videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "404":
          description: Not found

  /subscription-plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscriptions]
      summary: Get subscription plans
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      security:
        - adminAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users
      security:
        - adminAuth: []
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update user
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete user
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/users/{id}/reset-ip:
    post:
      operationId: resetUserIp
      tags: [admin]
      summary: Reset user IP
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: IP reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/videos:
    get:
      operationId: getAdminVideos
      tags: [admin]
      summary: Get all videos (admin)
      security:
        - adminAuth: []
      responses:
        "200":
          description: Videos list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVideo"
    post:
      operationId: createVideo
      tags: [admin]
      summary: Create video
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoInput"
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVideo"

  /admin/videos/{id}:
    patch:
      operationId: updateVideo
      tags: [admin]
      summary: Update video
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoInput"
      responses:
        "200":
          description: Video updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVideo"
    delete:
      operationId: deleteVideo
      tags: [admin]
      summary: Delete video
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/videos/reorder:
    post:
      operationId: reorderVideos
      tags: [admin]
      summary: Reorder videos
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderVideosInput"
      responses:
        "200":
          description: Videos reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/categories:
    get:
      operationId: getAdminCategories
      tags: [admin]
      summary: Get all categories (admin)
      security:
        - adminAuth: []
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create category
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/reorder:
    post:
      operationId: reorderCategories
      tags: [admin]
      summary: Reorder categories
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderCategoriesInput"
      responses:
        "200":
          description: Categories reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update category
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryInput"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete category
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/playlists:
    get:
      operationId: getAdminPlaylists
      tags: [admin]
      summary: Get all playlists (admin)
      security:
        - adminAuth: []
      responses:
        "200":
          description: Playlists list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [admin]
      summary: Create playlist
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistInput"
      responses:
        "201":
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"

  /admin/playlists/{id}:
    patch:
      operationId: updatePlaylist
      tags: [admin]
      summary: Update playlist
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistInput"
      responses:
        "200":
          description: Playlist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
    delete:
      operationId: deletePlaylist
      tags: [admin]
      summary: Delete playlist
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/subscription-plans:
    get:
      operationId: getAdminSubscriptionPlans
      tags: [admin]
      summary: Get all plans (admin)
      security:
        - adminAuth: []
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /admin/subscription-plans/{id}:
    patch:
      operationId: updateSubscriptionPlan
      tags: [admin]
      summary: Update subscription plan
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanInput"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
          minLength: 9
      required:
        - username
        - email
        - password
        - phone

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    GoogleLoginInput:
      type: object
      properties:
        credential:
          type: string
      required:
        - credential

    UpdatePhoneInput:
      type: object
      properties:
        phone:
          type: string
          minLength: 9
      required:
        - phone

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        admin:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
          required:
            - id
            - username
      required:
        - token
        - admin

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        accountType:
          type: string
          enum: [vip, normal]
        subscriptionType:
          type: string
          enum: [demo, monthly, annual, lifetime]
        subscriptionExpiresAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - accountType
        - subscriptionType
        - isActive
        - createdAt

    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required:
        - currentPassword
        - newPassword

    Video:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        driveEmbedUrl:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        playlistId:
          type: integer
          nullable: true
        partNumber:
          type: integer
          nullable: true
        isVipOnly:
          type: boolean
        accessType:
          type: string
          enum: [visitor, normal, vip]
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - thumbnailUrl
        - driveEmbedUrl
        - categoryId
        - isVipOnly
        - accessType
        - sortOrder
        - createdAt

    AdminVideo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        driveEmbedUrl:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        playlistId:
          type: integer
          nullable: true
        partNumber:
          type: integer
          nullable: true
        isVipOnly:
          type: boolean
        accessType:
          type: string
          enum: [visitor, normal, vip]
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        driveParts:
          type: string
          nullable: true
        softwareLink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - thumbnailUrl
        - driveEmbedUrl
        - categoryId
        - isVipOnly
        - accessType
        - isVisible
        - sortOrder
        - createdAt

    CreateVideoInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        driveEmbedUrl:
          type: string
        categoryId:
          type: integer
        isVipOnly:
          type: boolean
        accessType:
          type: string
          enum: [visitor, normal, vip]
        isVisible:
          type: boolean
        playlistId:
          type: integer
          nullable: true
        partNumber:
          type: integer
          nullable: true
      required:
        - title
        - description
        - thumbnailUrl
        - driveEmbedUrl
        - categoryId

    UpdateVideoInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        driveEmbedUrl:
          type: string
        categoryId:
          type: integer
        isVipOnly:
          type: boolean
        accessType:
          type: string
          enum: [visitor, normal, vip]
        isVisible:
          type: boolean
        playlistId:
          type: integer
          nullable: true
        partNumber:
          type: integer
          nullable: true

    ReorderVideosInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              sortOrder:
                type: integer
            required:
              - id
              - sortOrder
      required:
        - items

    ReorderCategoriesInput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              sortOrder:
                type: integer
            required:
              - id
              - sortOrder
      required:
        - items

    PlaylistVideo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        thumbnailUrl:
          type: string
        driveEmbedUrl:
          type: string
        partNumber:
          type: integer
          nullable: true
        accessType:
          type: string
          enum: [visitor, normal, vip]
        isVisible:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - title
        - thumbnailUrl
        - driveEmbedUrl
        - accessType
        - isVisible
        - createdAt

    Playlist:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        createdAt:
          type: string
        videos:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistVideo"
      required:
        - id
        - title
        - description
        - categoryId
        - sortOrder
        - isVisible
        - createdAt
        - videos

    CreatePlaylistInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        sortOrder:
          type: integer
        isVisible:
          type: boolean
      required:
        - title
        - categoryId

    UpdatePlaylistInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        sortOrder:
          type: integer
        isVisible:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameEn:
          type: string
          nullable: true
        slug:
          type: string
        icon:
          type: string
          nullable: true
        description:
          type: string
