components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
          minLength: 9
      required:
        - username
        - email
        - password
        - phone

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    GoogleLoginInput:
      type: object
      properties:
        credential:
          type: string
      required:
        - credential

    UpdatePhoneInput:
      type: object
      properties:
        phone:
          type: string
          minLength: 9
      required:
        - phone

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        admin:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
          required:
            - id
            - username
      required:
        - token
        - admin

    PushStatusInput:
      type: object
      properties:
        permission:
          type: string
          enum: [default, granted, denied, unsupported]
        supported:
          type: boolean
      required:
        - permission
        - supported

    PushStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
        permission:
          type: string
        supported:
          type: boolean
        shouldRemind:
          type: boolean
      required:
        - enabled
        - permission
        - supported
        - shouldRemind

    AdminNotificationStats:
      type: object
      properties:
        total:
          type: integer
        enabled:
          type: integer
        disabled:
          type: integer
      required:
        - total
        - enabled
        - disabled

    TestPushResult:
      type: object
      properties:
        attempted:
          type: integer
        success:
          type: integer
      required:
        - attempted
        - success

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        accountType:
          type: string
          enum: [vip, normal]
        subscriptionType:
          type: string
          enum: [demo, monthly, annual, lifetime]
        subscriptionExpiresAt:
          type: string
          format: date-time
          nullable: true
        subscriptionIsExpired:
          type: boolean
        isActive:
          type: boolean
        phone:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - accountType
        - subscriptionType
        - isActive
        - createdAt

    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required:
        - currentPassword
        - newPassword

    VideoStreamPart:
      type: object
      description: A single playable part streamed securely from our server (no Drive link exposed).
      properties:
        label:
          type: string
        url:
          type: string
          description: Same-origin, token-protected stream URL (e.g. /api/videos/{id}/stream/{part}?token=...).
        hlsUrl:
          type: string
          nullable: true
          description: Same-origin, token-protected HLS master playlist URL (adaptive bitrate). Present only for parts that have been transcoded; the MP4 `url` remains the fallback.
        lowUrl:
          type: string
          nullable: true
          description: Same-origin, token-protected 720p stream URL (lighter Drive copy). Present only when the background transcoder has produced a 720p copy; the player defaults to it with a toggle back to the original-quality `url`.
      required:
        - label
        - url

    Video:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        playlistId:
          type: integer
          nullable: true
        partNumber:
          type: integer
          nullable: true
        isVipOnly:
          type: boolean
        accessType:
          type: string
          enum: [visitor, normal, vip]
        sortOrder:
          type: integer
        streamParts:
          type: array
          nullable: true
          description: Present on the single-video response for entitled viewers; one entry per part.
          items:
            $ref: "#/components/schemas/VideoStreamPart"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - thumbnailUrl
        - categoryId
        - isVipOnly
        - accessType
        - sortOrder
        - createdAt

    MigrateVideoStorageResponse:
      type: object
      properties:
        message:
          type: string
        parts:
          type: integer
        totalBytes:
          type: integer
      required:
        - message
        - parts
        - totalBytes

    AdminVideo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        driveEmbedUrl:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        playlistId:
          type: integer
          nullable: true
        partNumber:
          type: integer
          nullable: true
        isVipOnly:
          type: boolean
        accessType:
          type: string
          enum: [visitor, normal, vip]
        isVisible:
          type: boolean
        sortOrder:
          type: integer
        driveParts:
          type: string
          nullable: true
        softwareLink:
          type: string
          nullable: true
        migratedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - thumbnailUrl
        - driveEmbedUrl
        - categoryId
        - isVipOnly
        - accessType
        - isVisible
        - sortOrder
        - createdAt

    CreateVideoInput:
