<Q>Qserver {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Serve static web assets ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Aggressive caching for hashed assets (Vite fingerprints bundles)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # ── Proxy API requests to the Node.js container ───────────────────────────
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Large body for file uploads
        client_max_body_size 512m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering for streaming video responses
        proxy_buffering off;
    }

    # ── Service Worker — no-cache so updates propagate immediately ────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # ── Web App Manifest ──────────────────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
