version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# GAB School — Production Docker Compose
#
# Storage: STORAGE_PROVIDER=local  → files at /app/data (Docker volume)
# Videos:  served from Google Drive via proxy (no change needed)
#
# PostgreSQL is created separately in Dokploy Dashboard.
#
# Usage on Dokploy:
#   1. Create PostgreSQL service in Dokploy
#   2. Create Application → GitHub → Dockerfile
#   3. Add environment variables in Dokploy UI (see .env.example)
#   4. Set domain → port 3000
#   5. Copy storage files: docker cp storage-export/. <container>:/app/data/
#
# Usage standalone:
#   cp .env.example .env && docker compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      LOCAL_DATA_DIR: "/app/data"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      APP_BASE_URL: "${APP_BASE_URL:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      GOOGLE_DRIVE_REFRESH_TOKEN: "${GOOGLE_DRIVE_REFRESH_TOKEN:-}"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app_data:
    driver: local
