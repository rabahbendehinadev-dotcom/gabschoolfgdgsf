version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# GAB School — Production Docker Compose
#
# Single-service setup: the API server serves both the API and the
# Vite-built frontend (SPA fallback). No nginx needed.
#
# PostgreSQL and MinIO are created separately in Dokploy Dashboard.
#
# Usage on Dokploy:
#   1. Create PostgreSQL service in Dokploy
#   2. Create MinIO service in Dokploy
#   3. Create Application → Docker Compose → point to this file on GitHub
#   4. Add environment variables in Dokploy UI
#   5. Set domain → port 3000
#
# Usage standalone (without Dokploy):
#   cp .env.example .env   # fill in values
#   docker compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-s3}"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      PRIVATE_OBJECT_DIR: "${PRIVATE_OBJECT_DIR}"
      PUBLIC_OBJECT_SEARCH_PATHS: "${PUBLIC_OBJECT_SEARCH_PATHS}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      GOOGLE_DRIVE_REFRESH_TOKEN: "${GOOGLE_DRIVE_REFRESH_TOKEN:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
