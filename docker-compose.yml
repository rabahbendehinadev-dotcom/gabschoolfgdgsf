version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# GAB School — Production Docker Compose
#
# Services:
#   nginx  — reverse proxy + static file server
#   api    — Express API server (Node.js)
#
# PostgreSQL is EXTERNAL (managed by Dokploy or hosted service).
# Set DATABASE_URL in your .env file.
#
# Usage:
#   cp .env.example .env       # fill in all values
#   docker compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web_static:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gabschool

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE_PROVIDER: "s3"
    volumes:
      - web_static:/app/public:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - gabschool

volumes:
  web_static:
    driver: local

networks:
  gabschool:
    driver: bridge
