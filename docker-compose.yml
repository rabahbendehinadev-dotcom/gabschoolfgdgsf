version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# GAB School — docker-compose.yml
#
# PURPOSE: Local development / standalone testing ONLY.
#          Dokploy should NOT use this file for the web application.
#
# ─── HOW TO DEPLOY ON DOKPLOY ─────────────────────────────────────────────────
#
#   Web application (this repo):
#     Dokploy → Create Application → GitHub → Dockerfile
#     ┌──────────────────────────────────────────────────┐
#     │  Build Path      : /  (repository root)          │
#     │  Dockerfile Path : Dockerfile                    │
#     │  Port            : 3000                          │
#     └──────────────────────────────────────────────────┘
#     Do NOT use Docker Compose mode for the web app.
#     Do NOT set the image to minio — MinIO is a separate Dokploy service.
#
#   PostgreSQL : Create separately via Dokploy → PostgreSQL service
#   MinIO      : Create separately via Dokploy → Docker Image (minio/minio)
#                MinIO is storage-only; it is NOT the web application.
#
# ─── LOCAL STANDALONE USAGE ───────────────────────────────────────────────────
#   cp .env.example .env && docker compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      LOCAL_DATA_DIR: "/app/data"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      APP_BASE_URL: "${APP_BASE_URL:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      GOOGLE_DRIVE_REFRESH_TOKEN: "${GOOGLE_DRIVE_REFRESH_TOKEN:-}"
      ENABLE_DRIVE_TRANSCODE: "${ENABLE_DRIVE_TRANSCODE:-false}"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app_data:
    driver: local
